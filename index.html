<style id="wedding-page-animations">
/* Elegant, formal page-turn animations */
.page {
  will-change: transform, opacity;
  transition: none !important;
}
.page img {
  will-change: transform, opacity, filter;
}

/* Triggered whenever a new page becomes active */
.page.animate-in img {
  animation: invitationReveal 900ms cubic-bezier(.22,.72,.18,1) both;
}
.page.animate-in::after {
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  background:
    radial-gradient(circle at 18% 18%, rgba(255,255,255,.35), transparent 24%),
    linear-gradient(110deg, transparent 25%, rgba(255,255,255,.20) 50%, transparent 75%);
  transform:translateX(-110%);
  animation: champagneSheen 1200ms ease-out both;
}
@keyframes invitationReveal {
  0%   { opacity:0; transform:scale(.965) translateY(12px); filter:blur(2px); }
  55%  { opacity:1; transform:scale(1.008) translateY(0); filter:blur(0); }
  100% { opacity:1; transform:scale(1) translateY(0); filter:blur(0); }
}
@keyframes champagneSheen {
  0%   { transform:translateX(-110%); opacity:0; }
  20%  { opacity:1; }
  100% { transform:translateX(110%); opacity:0; }
}

/* Alternating direction gives a refined digital-page feel */
.page.from-left.animate-in img {
  animation-name: pageFromLeft;
}
.page.from-right.animate-in img {
  animation-name: pageFromRight;
}
@keyframes pageFromLeft {
  0% {opacity:0; transform:translateX(-30px) scale(.985); filter:blur(1.5px);}
  65% {opacity:1; transform:translateX(4px) scale(1.002); filter:blur(0);}
  100% {opacity:1; transform:translateX(0) scale(1);}
}
@keyframes pageFromRight {
  0% {opacity:0; transform:translateX(30px) scale(.985); filter:blur(1.5px);}
  65% {opacity:1; transform:translateX(-4px) scale(1.002); filter:blur(0);}
  100% {opacity:1; transform:translateX(0) scale(1);}
}

/* Subtle floating ornament effect while a page is active */
.page.active img {
  animation: gentleFloat 7s ease-in-out infinite;
}
.page.animate-in.active img {
  animation: invitationReveal 900ms cubic-bezier(.22,.72,.18,1) both;
}
@keyframes gentleFloat {
  0%,100% { transform:translateY(0); }
  50% { transform:translateY(-2px); }
}

/* Keep animations comfortable for guests who prefer reduced motion */
@media (prefers-reduced-motion: reduce) {
  .page.animate-in img, .page.animate-in::after, .page.active img {
    animation:none !important;
  }
}
</style>

<div class="gift-cover"></div><div class="gift-glow"></div><div class="gift-base"></div><div class="gift-ribbon"></div><div class="gift-lid"></div><i class="gift-spark" style="--sx:-36px;--sd:0.0s"></i><i class="gift-spark" style="--sx:-18px;--sd:0.18s"></i><i class="gift-spark" style="--sx:8px;--sd:0.32s"></i><i class="gift-spark" style="--sx:29px;--sd:0.11s"></i><i class="gift-spark" style="--sx:41px;--sd:0.43s"></i><i class="gift-spark" style="--sx:-4px;--sd:0.55s"></i><div class="gift-prompt">Tap to open</div></div></section><section class="page"><img src="pages/page-10.jpg" alt="Wedding Timeline"></section><section class="page"><img src="pages/page-11.jpg" alt="Attire"></section><section class="page"><img src="pages/page-12.jpg" alt="Ceremony"></section><section class="page"><img src="pages/page-13.jpg" alt="Reception"></section><section class="page"><img src="pages/page-14.jpg" alt="Please Note"></section><section class="page"><img src="pages/page-15.jpg" alt="Kindly RSVP"></section><section class="page"><img src="pages/page-16.jpg" alt="Thank You"></section></main>
<div class="bottom"><button class="dot" aria-label="Go to page 1"></button><button class="dot" aria-label="Go to page 2"></button><button class="dot" aria-label="Go to page 3"></button><button class="dot" aria-label="Go to page 4"></button><button class="dot" aria-label="Go to page 5"></button><button class="dot" aria-label="Go to page 6"></button><button class="dot" aria-label="Go to page 7"></button><button class="dot" aria-label="Go to page 8"></button><button class="dot" aria-label="Go to page 9"></button><button class="dot" aria-label="Go to page 10"></button><button class="dot" aria-label="Go to page 11"></button><button class="dot" aria-label="Go to page 12"></button><button class="dot" aria-label="Go to page 13"></button><button class="dot" aria-label="Go to page 14"></button><button class="dot" aria-label="Go to page 15"></button><button class="dot" aria-label="Go to page 16"></button></div>
<div class="hint" id="hint">Swipe left or right to turn the pages</div>
<audio id="audio" preload="auto" loop src="audio/wedding-music.m4a"></audio>
</div>
<script>
const vp=document.getElementById('vp'), pages=[...document.querySelectorAll('.page')], dots=[...document.querySelectorAll('.dot')];
const audio=document.getElementById('audio'), music=document.getElementById('music'), home=document.getElementById('home'), full=document.getElementById('full');
let idx=0;
function animatePage(target, direction){
  pages.forEach(p=>p.classList.remove('animate-in','from-left','from-right','active'));
  target.classList.add(direction === 'left' ? 'from-left' : 'from-right');
  void target.offsetWidth;
  target.classList.add('animate-in','active');
  setTimeout(()=>target.classList.remove('animate-in','from-left','from-right'),1100);
}
function go(n){
  const next=Math.max(0,Math.min(15,n));
  const direction=next>=idx ? 'right' : 'left';
  idx=next;
  pages[idx].scrollIntoView({behavior:'smooth',inline:'center'});
  dots.forEach((d,i)=>d.classList.toggle('active',i===idx));
  animatePage(pages[idx],direction);
}
dots.forEach((d,i)=>d.onclick=()=>go(i)); home.onclick=()=>go(0);
full.onclick=async()=>{{
  try{{
    if(!document.fullscreenElement) await document.documentElement.requestFullscreen();
    else await document.exitFullscreen();
  }}catch(e){{}}
}};
document.addEventListener('fullscreenchange',()=>{{full.textContent=document.fullscreenElement?'×':'⛶'}});
let t; vp.addEventListener('scroll',()=>{clearTimeout(t);t=setTimeout(()=>{let c=vp.scrollLeft+vp.clientWidth/2,b=0,dist=1e9;pages.forEach((p,i)=>{let d=Math.abs(p.offsetLeft+p.offsetWidth/2-c);if(d<dist){dist=d;b=i}});const previous=idx; idx=b; dots.forEach((d,i)=>d.classList.toggle('active',i===idx));
if (b !== previous) animatePage(pages[idx], b > previous ? 'right' : 'left');},80)});
music.onclick=async()=>{try{if(audio.paused){await audio.play();music.textContent='❚❚'}else{audio.pause();music.textContent='♫'}}catch(e){alert('Tap the music button again to start the music.')}};
setTimeout(()=>document.getElementById('hint').style.opacity=0,4500);go(0);
</script>
<script id="premium-interactions">
(()=>{
 const cover=document.getElementById('cover'),env=document.getElementById('envelope'),openBtn=document.getElementById('openInvite'),petals=document.getElementById('petals');
 document.body.classList.add('cover-active');
 for(let i=0;i<18;i++){const p=document.createElement('i');p.className='petal';p.style.left=(Math.random()*100)+'vw';p.style.animationDuration=(8+Math.random()*9)+'s';p.style.animationDelay=(-Math.random()*14)+'s';p.style.transform=`scale(${.65+Math.random()*.8})`;petals.appendChild(p)}
 let opening=false;
 async function openInvitation(){if(opening)return;opening=true;env.classList.add('open');openBtn.textContent='Opening…';setTimeout(async()=>{cover.classList.add('hidden');document.body.classList.remove('cover-active');try{if(audio&&audio.paused){await audio.play();music.textContent='❚❚'}}catch(e){}setTimeout(()=>{cover.remove()},1100)},900)}
 env.addEventListener('click',openInvitation);openBtn.addEventListener('click',openInvitation);env.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openInvitation()}});
})();
</script>


<script id="premium-floral-gift-script">
(function(){
  const fx=document.getElementById('premiumFx');
  if(fx){
    const count=18;
    for(let i=0;i<count;i++){
      const p=document.createElement('i'); p.className='petalfx';
      p.style.left=(Math.random()*100)+'vw';
      p.style.setProperty('--dur',(7+Math.random()*7)+'s');
      p.style.setProperty('--delay',(-Math.random()*12)+'s');
      p.style.setProperty('--drift',((-45+Math.random()*90))+'px');
      p.style.transform='scale('+(0.55+Math.random()*.9)+')'; fx.appendChild(p);
    }
  }
  const box=document.getElementById('giftBox');
  if(box){
    const open=()=>{if(!box.classList.contains('open')){box.classList.add('open'); box.setAttribute('aria-label','Gift box opened');}}
    box.addEventListener('click',open);
    box.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open();}});
  }
})();
</script>

<script id="mj-envelope-cover-script">
(function(){
 const c=document.getElementById('mjCover'),b=document.getElementById('mjOpen');
 if(!c||!b)return;
 document.body.classList.add('cover-active');
 let opened=false;
 async function openMJ(){
   if(opened)return; opened=true; c.classList.add('open');
   const audio=document.getElementById('audio'),music=document.getElementById('music');
   try{ if(audio&&audio.paused){ await audio.play(); if(music)music.textContent='❚❚'; } }catch(e){}
   setTimeout(()=>{
     c.classList.add('done'); document.body.classList.remove('cover-active');
     const vp=document.getElementById('vp'); if(vp)vp.scrollTo({left:0,behavior:'smooth'});
     setTimeout(()=>c.remove(),900);
   },1650);
 }
 b.addEventListener('click',openMJ);
 c.addEventListener('click',e=>{if(e.target===c||e.target.classList.contains('mj-bg'))openMJ()});
})();
</script>
